<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalidraw Offline</title>
    <!-- Classic script: bare `bindings` resolves in main world; ESM cannot. -->
    <script>
      window.__eoGetBindings = function () {
        try {
          if (typeof bindings !== "undefined") return bindings;
        } catch (_) {}
        try {
          if (globalThis.bindings) return globalThis.bindings;
        } catch (_) {}
        return null;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
