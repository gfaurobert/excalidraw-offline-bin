name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(deno eval --quiet 'import { readDenoJsonVersion } from "./scripts/release-names.ts"; console.log(readDenoJsonVersion(await Deno.readTextFile("deno.json")));')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"

      - name: Package Linux release artifacts
        run: bash ./scripts/package-linux-release.sh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          GITHUB_REF: ${{ github.ref }}

      - name: Upload workflow artifacts (dispatch / always retain)
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ steps.ver.outputs.version }}
          path: |
            dist/release/*.AppImage
            dist/release/*.tar.xz
            dist/release/SHA256SUMS

      - name: Write release notes
        if: github.ref_type == 'tag'
        id: relnotes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(git tag -l 'v*' | deno run -A ./scripts/previous-release-tag-cli.ts "${{ github.ref_name }}")
          if [[ -z "$PREV" ]]; then
            echo "No previous release tag for ${{ github.ref_name }}"
            exit 1
          fi
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"
          GENERATED=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=${{ github.ref_name }}" \
            -f "previous_tag_name=${PREV}" \
            -f "target_commitish=${{ github.ref_name }}" \
            --jq .body)
          if [[ -f packaging/release-notes-prepend.md ]]; then
            cat packaging/release-notes-prepend.md > dist/RELEASE_BODY.md
            echo >> dist/RELEASE_BODY.md
          else
            : > dist/RELEASE_BODY.md
          fi
          echo "$GENERATED" >> dist/RELEASE_BODY.md

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.AppImage
            dist/release/*.tar.xz
            dist/release/SHA256SUMS
          body_path: dist/RELEASE_BODY.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
