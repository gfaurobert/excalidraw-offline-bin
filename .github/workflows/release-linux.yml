name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Oldest supported Ubuntu runner keeps the AppImage's glibc baseline low.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps (GTK3 / WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Build AppImage + PKGBUILD
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RUSTFLAGS: -D warnings
        run: ./scripts/package-tauri-linux-release.sh

      - name: Resolve version
        id: ver
        run: echo "version=$(sed -nE 's/^pkgver=(.+)$/\1/p' packaging/PKGBUILD)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test AppImage (/api/health)
        run: |
          sudo apt-get install -y xvfb
          APP="$(ls dist/release/*.AppImage)"
          LOG=$(mktemp)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$APP" >"$LOG" 2>&1 &
          for _ in $(seq 120); do
            PORT=$(grep -oE 'app url http://127\.0\.0\.1:[0-9]+' "$LOG" | head -1 | sed 's/.*://') || true
            [ -n "$PORT" ] && break
            sleep 0.5
          done
          [ -n "$PORT" ] || { cat "$LOG"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/health")
          echo "health=$CODE"
          pkill -f excalidraw-offline || true
          if grep -qi panick "$LOG"; then cat "$LOG"; exit 1; fi
          [ "$CODE" = 200 ]

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ steps.ver.outputs.version }}
          path: |
            dist/release/*.AppImage
            dist/release/*.tar.gz
            dist/release/PKGBUILD
            dist/release/PKGBUILD-bin
          if-no-files-found: error

  arch-package:
    needs: [appimage]
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build deps (no pacman rust/pnpm — rustup + corepack pnpm)
        run: |
          pacman -Syu --noconfirm --needed base-devel git namcap nodejs curl noto-fonts \
            webkit2gtk-4.1 gtk3 libsoup3 hicolor-icon-theme shared-mime-info desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-${{ needs.appimage.outputs.version }}
          path: dist/release

      - name: makepkg (PKGBUILD.local, rustup) + PKGBUILD-bin + namcap
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c 'curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.90.0'
          su builder -c 'npm install -g pnpm@10'
          cd packaging
          su builder -c 'source ~/.cargo/env && makepkg -f -p PKGBUILD.local --noconfirm' 2>&1 | tee makepkg.log
          if grep -qE '(^|\s)WARNING' makepkg.log; then echo "makepkg reported warnings"; exit 1; fi
          cp ../dist/release/excalidraw-offline-*-linux-x86_64.tar.gz .
          cp ../dist/release/PKGBUILD-bin PKGBUILD-bin
          su builder -c 'makepkg -f -p PKGBUILD-bin --noconfirm' 2>&1 | tee makepkg-bin.log
          # ld-linux provides __tls_get_addr (used); namcap does not see loader symbols.
          namcap PKGBUILD PKGBUILD.local PKGBUILD-bin excalidraw-offline-*.pkg.tar.zst excalidraw-offline-bin-*.pkg.tar.zst \
            | grep -v "Unused shared library '/usr/lib64/ld-linux-x86-64.so.2'" | tee namcap.txt || true
          if [ -s namcap.txt ]; then echo "namcap reported issues"; exit 1; fi
          pacman -U --noconfirm excalidraw-offline-bin-*.pkg.tar.zst
          excalidraw-offline --help | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch-package
          path: |
            packaging/excalidraw-offline-*.pkg.tar.zst
            packaging/excalidraw-offline-bin-*.pkg.tar.zst
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [appimage, arch-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Collect assets + checksums
        run: |
          mkdir -p dist/release
          find dist/artifacts -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name 'PKGBUILD' -o -name 'PKGBUILD-bin' -o -name '*.pkg.tar.zst' \) -exec cp {} dist/release/ \;
          chmod +x dist/release/*.AppImage
          (cd dist/release && sha256sum * > SHA256SUMS)
          ls -la dist/release

      - name: Write release notes
        id: relnotes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(./scripts/previous-release-tag.sh "${{ github.ref_name }}" $(git tag -l 'v*'))
          if [[ -z "$PREV" ]]; then
            echo "No previous release tag for ${{ github.ref_name }}"
            exit 1
          fi
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"
          GENERATED=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=${{ github.ref_name }}" \
            -f "previous_tag_name=${PREV}" \
            -f "target_commitish=${{ github.ref_name }}" \
            --jq .body)
          if [[ -f packaging/release-notes-prepend.md ]]; then
            cat packaging/release-notes-prepend.md > dist/RELEASE_BODY.md
            echo >> dist/RELEASE_BODY.md
          else
            : > dist/RELEASE_BODY.md
          fi
          echo "$GENERATED" >> dist/RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.AppImage
            dist/release/*.tar.gz
            dist/release/*.pkg.tar.zst
            dist/release/PKGBUILD
            dist/release/PKGBUILD-bin
            dist/release/SHA256SUMS
          body_path: dist/RELEASE_BODY.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
