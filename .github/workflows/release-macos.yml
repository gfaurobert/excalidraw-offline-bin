name: Release macOS

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-only-tag-check:
    runs-on: ubuntu-latest
    outputs:
      skip_non_linux: ${{ steps.out.outputs.skip_non_linux }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        run: |
          SKIP=false
          if [[ "${{ github.ref_type }}" == "tag" ]] && [[ -f packaging/linux-only-release-tags.txt ]]; then
            if grep -qx "${{ github.ref_name }}" packaging/linux-only-release-tags.txt; then
              SKIP=true
              echo "Skipping macOS release upload for linux-only tag ${{ github.ref_name }}"
            fi
          fi
          echo "skip_non_linux=$SKIP" >> "$GITHUB_OUTPUT"

  macos:
    needs: linux-only-tag-check
    if: ${{ needs.linux-only-tag-check.outputs.skip_non_linux != 'true' }}
    runs-on: macos-14
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Resolve + check version
        id: ver
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          V=$(scripts/release-version.sh)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy macOS (deny warnings)
        working-directory: src-tauri
        run: |
          rustup component add clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo clippy --target aarch64-apple-darwin -- -D warnings
          cargo clippy --target x86_64-apple-darwin -- -D warnings

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Build arm64 + universal .app
        working-directory: src-tauri
        run: |
          cargo tauri build --target aarch64-apple-darwin --config tauri.macos.ci.json
          cargo tauri build --target universal-apple-darwin --config tauri.macos.ci.json

      - name: Ad-hoc sign
        run: |
          for app in src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app \
                     src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            codesign --force --deep -s - "$app"
          done

      - name: Verify (codesign, lipo, /api/health)
        run: |
          scripts/verify-tauri-macos.sh "$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)" arm64
          scripts/verify-tauri-macos.sh "$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)" "arm64 x86_64"

      - name: Package + checksums
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist/release-macos
          ditto -c -k --keepParent src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app "dist/release-macos/excalidraw-offline-$V-macos-arm64.zip"
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app "dist/release-macos/excalidraw-offline-$V-macos-universal.zip"
          cd dist/release-macos && shasum -a 256 *.zip > SHA256SUMS-macos && cat SHA256SUMS-macos

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.ver.outputs.version }}
          path: dist/release-macos/*
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release-macos/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
