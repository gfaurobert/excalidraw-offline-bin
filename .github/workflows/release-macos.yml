name: Release macOS

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-only-tag-check:
    runs-on: ubuntu-latest
    outputs:
      skip_non_linux: ${{ steps.out.outputs.skip_non_linux }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        run: |
          SKIP=false
          if [[ "${{ github.ref_type }}" == "tag" ]] && [[ -f packaging/linux-only-release-tags.txt ]]; then
            if grep -qx "${{ github.ref_name }}" packaging/linux-only-release-tags.txt; then
              SKIP=true
              echo "Skipping macOS release upload for linux-only tag ${{ github.ref_name }}"
            fi
          fi
          echo "skip_non_linux=$SKIP" >> "$GITHUB_OUTPUT"

  macos-arm64:
    needs: linux-only-tag-check
    if: ${{ needs.linux-only-tag-check.outputs.skip_non_linux != 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(deno eval --quiet 'import { readDenoJsonVersion } from "./scripts/release-names.ts"; console.log(readDenoJsonVersion(await Deno.readTextFile("deno.json")));')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"

      - name: Package macOS release artifacts
        run: deno task package:macos:release
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          GITHUB_REF: ${{ github.ref }}

      - name: Upload workflow artifacts (dispatch / always retain)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            dist/release-macos/*.dmg
            dist/release-macos/*.zip
            dist/release-macos/SHA256SUMS-macos-arm64

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-macos/*.dmg
            dist/release-macos/*.zip
            dist/release-macos/SHA256SUMS-macos-arm64
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
