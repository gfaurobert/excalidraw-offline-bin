[package]
name = "excalidraw-offline"
version = "0.7.2"
description = "Excalidraw Offline (Tauri 2 POC)"
authors = ["Excalidraw Offline"]
edition = "2021"

[lib]
name = "excalidraw_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "excalidraw-offline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
base64 = "0.22"
dirs = "5"
chrono = "0.4"
mime_guess = "2"
parking_lot = "0.12"
thiserror = "2"
include_dir = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3", "async-std"] }
gtk = { version = "0.18", features = ["v3_24"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = true, features = ["common-controls-v6"] }

